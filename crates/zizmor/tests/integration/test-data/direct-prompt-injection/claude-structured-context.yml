name: claude-structured-context

on: pull_request

permissions: {}

jobs:
  run-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          prompt: "Review PR: ${{ github.event.pull_request.html_url }}"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
