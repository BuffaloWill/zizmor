name: claude-gh-pr-list

on: pull_request

permissions: {}

jobs:
  run-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            Run gh pr list and summarize the open pull requests.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
