name: claude-gh-pr-diff

on: pull_request

permissions: {}

jobs:
  run-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            Run gh pr diff ${{ github.event.pull_request.number }} and analyze the changes.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
