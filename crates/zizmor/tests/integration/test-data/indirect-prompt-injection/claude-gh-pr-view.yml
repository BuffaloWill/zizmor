name: claude-gh-pr-view

on: pull_request

permissions: {}

jobs:
  run-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            Run gh pr view ${{ github.event.pull_request.number }} and review it.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
